<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    OpenGraph card — Data Druid aesthetic.
    1200x630 parchment background, monogram at center-left,
    site title and tagline to the right.
  -->
  <defs>
    <style>
      .bg     { fill: #f5f2eb; }
      .accent { fill: #4a8c6f; }
      .accent-dim { fill: #4a8c6f; opacity: 0.65; }
      .fg     { fill: #1a1a1a; }
      .muted  { fill: #6b6459; }
      .border { stroke: #d4cfc5; stroke-width: 4; fill: none; }
      .title-text {
        font-family: "IBM Plex Mono", ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, monospace;
        font-weight: 700;
        font-size: 72px;
        fill: #1a1a1a;
      }
      .tagline-text {
        font-family: "IBM Plex Mono", ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, monospace;
        font-weight: 400;
        font-style: italic;
        font-size: 34px;
        fill: #6b6459;
      }
      .url-text {
        font-family: "IBM Plex Mono", ui-monospace, "Cascadia Code", "Source Code Pro", Menlo, Consolas, monospace;
        font-weight: 600;
        font-size: 24px;
        fill: #4a8c6f;
        letter-spacing: 0.05em;
      }
    </style>
  </defs>

  <!-- Parchment background -->
  <rect class="bg" width="1200" height="630"/>

  <!-- Subtle inner border frame -->
  <rect class="border" x="32" y="32" width="1136" height="566" rx="8" ry="8"/>

  <!--
    Monogram (memento mori skull, inlined from src/assets/img/pixel/monogram.svg).
    Original viewBox is 0 0 32 32. We scale by 12 and translate so it sits
    at center-left. 32 * 12 = 384px square. Positioned at (96, 123) so its
    vertical center aligns near the visual midline.
  -->
  <g transform="translate(96 123) scale(12)">
    <!-- Leaf sprout -->
    <rect class="accent-dim" x="15" y="2"  width="2" height="5"/>
    <rect class="accent-dim" x="10" y="3"  width="5" height="2"/>
    <rect class="accent-dim" x="17" y="3"  width="5" height="2"/>
    <rect class="accent-dim" x="9"  y="4"  width="2" height="2"/>
    <rect class="accent-dim" x="21" y="4"  width="2" height="2"/>

    <!-- Skull dome -->
    <rect class="accent" x="12" y="7"  width="8"  height="2"/>
    <rect class="accent" x="10" y="9"  width="12" height="2"/>
    <rect class="accent" x="8"  y="11" width="16" height="2"/>
    <rect class="accent" x="8"  y="13" width="16" height="2"/>

    <!-- Eye sockets row -->
    <rect class="accent" x="8"  y="15" width="3"  height="6"/>
    <rect class="accent" x="14" y="15" width="4"  height="6"/>
    <rect class="accent" x="21" y="15" width="3"  height="6"/>

    <!-- Cheekbone -->
    <rect class="accent" x="9"  y="21" width="14" height="2"/>

    <!-- Nasal row -->
    <rect class="accent" x="9"  y="23" width="5"  height="2"/>
    <rect class="accent" x="18" y="23" width="5"  height="2"/>

    <!-- Teeth -->
    <rect class="accent" x="9"  y="25" width="5"  height="3"/>
    <rect class="accent" x="18" y="25" width="5"  height="3"/>
  </g>

  <!-- Site title — beside the monogram -->
  <text class="title-text" x="520" y="295">Seb (the Canadian).</text>

  <!-- Tagline beneath title -->
  <text class="tagline-text" x="520" y="355">Civic Technology · Knowledge Architecture</text>

  <!-- URL bottom-right corner accent -->
  <text class="url-text" x="520" y="430">sebthecanadian.ca</text>
</svg>
