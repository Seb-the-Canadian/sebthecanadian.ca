<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Pixel art "S" monogram in forest green -->
  <style>
    .p { fill: currentColor; }
  </style>
  <!-- Row 1-2: Top bar -->
  <rect class="p" x="8" y="2" width="16" height="2"/>
  <!-- Row 3-4: Top-left corner -->
  <rect class="p" x="6" y="4" width="4" height="2"/>
  <rect class="p" x="22" y="4" width="4" height="2"/>
  <!-- Row 5-6: Left side -->
  <rect class="p" x="4" y="6" width="4" height="2"/>
  <!-- Row 7-8: Left side -->
  <rect class="p" x="4" y="8" width="4" height="2"/>
  <!-- Row 9-10: Left turn into middle -->
  <rect class="p" x="6" y="10" width="4" height="2"/>
  <!-- Row 11-12: Middle bar -->
  <rect class="p" x="10" y="12" width="12" height="2"/>
  <!-- Row 13-14: Right turn from middle -->
  <rect class="p" x="22" y="14" width="4" height="2"/>
  <!-- Row 15-16: Right side -->
  <rect class="p" x="24" y="16" width="4" height="2"/>
  <!-- Row 17-18: Right side -->
  <rect class="p" x="24" y="18" width="4" height="2"/>
  <!-- Row 19-20: Bottom-right corner -->
  <rect class="p" x="22" y="20" width="4" height="2"/>
  <rect class="p" x="6" y="20" width="4" height="2"/>
  <!-- Row 21-22: Bottom bar -->
  <rect class="p" x="8" y="22" width="16" height="2"/>
  <!-- Decorative pixel dots -->
  <rect class="p" opacity="0.4" x="14" y="26" width="2" height="2"/>
  <rect class="p" opacity="0.4" x="16" y="28" width="2" height="2"/>
</svg>
