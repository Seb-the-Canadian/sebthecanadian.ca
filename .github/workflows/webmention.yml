name: Send Webmentions

# Runs after each push or manual deploy that succeeds, so the pages it
# announces are already live (the old trigger watched for .html files in the
# repository, which the site's Markdown and Nunjucks never produce). The
# daily scheduled rebuild is left out, so the same pages are not announced
# again every day. It needs no repository access, so its token gets none. It
# can also be run by hand from the Actions tab.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and Deploy"]
    types: [completed]

permissions: {}

jobs:
  send:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'schedule')
    runs-on: ubuntu-latest
    steps:
      - name: Send webmentions for sources
        env:
          SITE_URL: https://sebthecanadian.ca
        run: |
          set -euo pipefail
          sources=(
            "$SITE_URL/"
            "$SITE_URL/writing/"
            "$SITE_URL/projects/"
            "$SITE_URL/resume/"
            "$SITE_URL/now/"
            "$SITE_URL/about/"
            "$SITE_URL/uses/"
            "$SITE_URL/links/"
          )

          for source in "${sources[@]}"; do
            echo "Checking ${source}"
            curl -fsSI --retry 5 --retry-delay 10 --retry-all-errors "${source}" > /dev/null
          done

          for source in "${sources[@]}"; do
            echo "Sending webmentions for ${source}"
            status="$(curl -sS -o /tmp/telegraph.json -w "%{http_code}" -X POST \
              --data-urlencode "source=${source}" \
              https://telegraph.p3k.io/send)"
            if [ "${status}" -eq 404 ]; then
              echo "Telegraph returned HTTP 404 for ${source} (no webmention targets found)."
              cat /tmp/telegraph.json || true
              continue
            fi
            if [ "${status}" -ge 400 ]; then
              echo "Telegraph returned HTTP ${status} for ${source}"
              cat /tmp/telegraph.json || true
              exit 1
            fi
            cat /tmp/telegraph.json || true
          done
